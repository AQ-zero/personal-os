<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" role="img" aria-label="Personal OS · 成长操作系统">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F3ED"/>
      <stop offset="1" stop-color="#E9E6DC"/>
    </linearGradient>
    <radialGradient id="auraA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2E5A49" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#2E5A49" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2E5A49" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#84B4A1" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#84B4A1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#84B4A1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C7A86B" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#C7A86B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#C7A86B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="330" cy="150" r="230" fill="url(#auraA)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 34 24; -18 12; 0 0" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;1;0.75;0.9" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="250" r="270" fill="url(#auraB)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -30 -20; 16 -10; 0 0" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.7;0.85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="330" r="190" fill="url(#auraC)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 22 -16; -22 8; 0 0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.95;0.6;0.7" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="16.5" y="16.5" width="1167" height="367" rx="15" fill="none" stroke="#2E5A49" stroke-opacity="0.14"/>

  <g transform="translate(600 116)">
    <path d="M0 -32 L6.5 -6.5 L32 0 L6.5 6.5 L0 32 L-6.5 6.5 L-32 0 L-6.5 -6.5 Z" fill="#2E5A49">
      <animateTransform attributeName="transform" type="scale" values="1;1.13;1" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.82;1;0.82" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <circle r="2.6" fill="#F5F3ED"/>
  </g>

  <text x="600" y="224" text-anchor="middle" font-family="Georgia,'Times New Roman','Songti SC',serif" font-size="84" font-weight="500" fill="#1B1A16" letter-spacing="1.5">Personal OS<tspan fill="#2E5A49">.</tspan></text>
  <text x="600" y="270" text-anchor="middle" font-size="22" fill="#5A5647" letter-spacing="12">成长操作系统</text>
  <line x1="524" y1="312" x2="676" y2="312" stroke="#2E5A49" stroke-opacity="0.30"/>
  <text x="600" y="346" text-anchor="middle" font-size="14.5" fill="#8A8574" letter-spacing="2.5">本地优先　·　自带模型　·　一次买断　·　数据主权</text>
</svg>
